name: release

# Builds the Kirn toolchain for all six supported target triples and, on a v*
# tag, publishes them to a GitHub Release together with a rust-style installer.
#
#   Linux / macOS / Windows x amd64 / arm64
#
# Three runners produce six targets: the native build of each runner, plus a
# cross build for the sibling architecture. A dispatch with no tag is a DRY RUN:
# the whole matrix still builds and is still verified, but nothing is published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release as (e.g. v0.1.0). Leave empty for a dry run."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
            publish=true
          elif [ "${REF#refs/tags/}" != "$REF" ]; then
            tag="${REF#refs/tags/}"
            publish=true
          else
            tag="nightly-$(git rev-parse --short HEAD)"
            publish=false
          fi
          {
            echo "version=${tag#v}"
            echo "tag=$tag"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "version=${tag#v} tag=$tag publish=$publish"

  build:
    name: ${{ matrix.target }}
    needs: meta
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      # One target failing must not hide the state of the other five.
      fail-fast: false
      matrix:
        include:
          # --- Linux (x64 runner): native amd64, cross to arm64 -------------
          - target: linux-amd64
            os: ubuntu-latest
            mode: native
            runner_target: linux-amd64
          - target: linux-arm64
            os: ubuntu-latest
            mode: cross
            cc: aarch64-linux-gnu-g++
            sysroot: /usr/aarch64-linux-gnu
          # --- macOS (Apple Silicon runner): native arm64, cross to amd64 ---
          - target: darwin-arm64
            os: macos-latest
            mode: native
            runner_target: darwin-arm64
          - target: darwin-amd64
            os: macos-latest
            mode: cross
            osx_arch: x86_64
          # --- Windows (x64 runner): native amd64, cross to arm64 -----------
          - target: windows-amd64
            os: windows-latest
            mode: native
            runner_target: windows-amd64
          - target: windows-arm64
            os: windows-latest
            mode: cross
            cc: aarch64-w64-mingw32-g++

    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships cmake; the Arch/macOS images do not guarantee it.
      - name: Ensure cmake
        shell: bash
        run: |
          set -euo pipefail
          if command -v cmake >/dev/null 2>&1; then cmake --version | head -1; exit 0; fi
          echo "cmake missing; installing"
          case "$(uname -s)" in
            Darwin) brew install cmake ;;
            MINGW*|MSYS*|CYGWIN*) choco install cmake --no-progress ;;
            *) sudo apt-get update && sudo apt-get install -y cmake ;;
          esac
          cmake --version | head -1

      - name: Install cross toolchain (linux-arm64)
        if: matrix.cc == 'aarch64-linux-gnu-g++'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          # libc6-dev-arm64-cross provides the target headers and link-time
          # libraries; g++-aarch64-linux-gnu alone does not pull all of them in.
          sudo apt-get install -y g++-aarch64-linux-gnu libc6-dev-arm64-cross
          aarch64-linux-gnu-g++ --version | head -1

      - name: Install cross toolchain (windows-arm64)
        if: matrix.cc == 'aarch64-w64-mingw32-g++'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = "20260616"
          $zip = "$env:RUNNER_TEMP\llvm-mingw-$ver.zip"
          Invoke-WebRequest -Uri `
            "https://github.com/mstorsjo/llvm-mingw/releases/download/$ver/llvm-mingw-$ver-ucrt-x86_64.zip" `
            -OutFile $zip
          $bin = "$env:RUNNER_TEMP\llvm-mingw\llvm-mingw-$ver-ucrt-x86_64\bin"
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\llvm-mingw"
          if (-not (Test-Path -LiteralPath $bin)) { throw "llvm-mingw bin not found at $bin" }
          # GITHUB_PATH only applies to LATER steps, so the compiler also has to
          # be put on PATH here for the check below to find it.
          Add-Content $env:GITHUB_PATH $bin
          $env:PATH = "$bin;$env:PATH"
          aarch64-w64-mingw32-g++ --version | Select-Object -First 1

      - name: Configure and build
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
          TARGET: ${{ matrix.target }}
          CC: ${{ matrix.cc }}
          SYSROOT: ${{ matrix.sysroot }}
        run: |
          set -euo pipefail
          case "$MODE" in
            native)
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
              ;;
            cross)
              # Everything below is derived from the target triple. Hardcoding the
              # system name is a trap: a "Linux" system name for the Windows
              # cross build silently drops if(WIN32) from CMakeLists, so ws2_32
              # is never linked and the link fails on WSAStartup.
              os="${TARGET%%-*}"
              arch="${TARGET#*-}"
              case "$arch" in
                arm64) proc=aarch64 ;;
                amd64) proc=x86_64 ;;
                *) echo "::error::cannot map arch '$arch'"; exit 1 ;;
              esac
              if [ "$os" = "darwin" ]; then
                # Apple clang cross-builds to the sibling arch off one SDK.
                cmake -S . -B build \
                  -DCMAKE_BUILD_TYPE=Release \
                  -DCMAKE_OSX_ARCHITECTURES="$proc"
              else
                case "$os" in
                  linux) sysname=Linux ;;
                  windows) sysname=Windows ;;
                  *) echo "::error::cannot map os '$os'"; exit 1 ;;
                esac
                # Deliberately NOT -static on the ELF target: the Ubuntu cross
                # toolchain ships no static libc/libm. The glibc floor is set by
                # the build runner - see the release notes.
                cmake -S . -B build -G Ninja \
                  -DCMAKE_BUILD_TYPE=Release \
                  -DCMAKE_SYSTEM_NAME="$sysname" \
                  -DCMAKE_SYSTEM_PROCESSOR="$proc" \
                  -DCMAKE_CXX_COMPILER="$CC" \
                  -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER
                if [ "$os" = "linux" ]; then
                  cmake -S . -B build \
                    -DCMAKE_FIND_ROOT_PATH="$SYSROOT"
                fi
              fi
              ;;
            *) echo "::error::unknown mode $MODE"; exit 1 ;;
          esac
          cmake --build build --config Release

      # For a native target the host MUST match, otherwise the archive would be
      # mislabelled (macos-latest has already moved between Intel and Apple
      # Silicon once). Cross targets are verified structurally below instead.
      - name: Verify native target matches the runner
        if: matrix.mode == 'native'
        shell: bash
        env:
          EXPECTED: ${{ matrix.runner_target }}
        run: |
          set -euo pipefail
          # Git-bash on Windows reports MINGW64_NT-*, so it needs its own case or
          # the check below cannot tell a Windows runner from an unknown host.
          uname_s="$(uname -s)"
          case "$uname_s" in
            Linux) os=linux ;;
            Darwin) os=darwin ;;
            MINGW*|MSYS*|CYGWIN*|Windows_NT) os=windows ;;
            *) os="unknown($uname_s)" ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64) arch=amd64 ;;
            arm64|aarch64) arch=arm64 ;;
            *) arch="$(uname -m)" ;;
          esac
          actual="$os-$arch"
          echo "runner is $actual, matrix claims $EXPECTED"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::runner is $actual but this job is labelled $EXPECTED - fix the matrix"
            exit 1
          fi

      - name: Verify cross target architecture
        if: matrix.mode == 'cross'
        shell: bash
        env:
          EXPECTED: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # A cross binary cannot run on the build machine, so assert on the
          # header bytes instead. ELF e_machine, PE machine, and Mach-O cputype
          # are all read straight out of the file.
          python3 - "$EXPECTED" <<'PY'
          import glob, struct, sys
          expected = sys.argv[1]
          want = {
              "linux-arm64": (0xB7, "ELF AArch64"),
              "darwin-amd64": (0x01000007, "Mach-O x86_64"),
              "windows-arm64": (0xAA64, "PE ARM64"),
          }[expected]
          code, label = want
          paths = glob.glob("build/kirn") + glob.glob("build/Release/kirn.exe") \
              + glob.glob("build/kirn.exe")
          if not paths:
              sys.exit("no kirn binary found in build/")
          path = paths[0]
          with open(path, "rb") as f:
              b = f.read()
          if b[:4] == b"\x7fELF":
              got = struct.unpack_from("<H", b, 18)[0]
          elif b[:2] == b"MZ":
              pe = struct.unpack_from("<I", b, 0x3C)[0]
              got = struct.unpack_from("<H", b, pe + 4)[0]
          elif b[:4] in (b"\xfe\xed\xfa\xcf", b"\xcf\xfa\xed\xfe"):
              got = struct.unpack_from("<I", b, 4)[0] & 0xFFFFFFFF
          else:
              sys.exit(f"{path}: unrecognised binary format")
          print(f"{path}: machine=0x{got:04X} (expected {label} 0x{code:04X})")
          if got != code:
              sys.exit(f"wrong architecture: got 0x{got:04X}, want {label}")
          PY

      # One executable plus the data it needs: stdlib/ for imports, src/ for
      # `kirn build --native`. Neither is an executable - this is one binary.
      - name: Stage distribution
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # MSVC is multi-config and drops binaries in build/Release.
          if [ -f build/Release/kirn.exe ]; then bindir=build/Release; else bindir=build; fi
          # $ext carries its own leading dot: it is concatenated directly, and
          # without the dot the copies below are named "kirnexe" and
          # "kirn-windows-amd64exe".
          if [ -f "$bindir/kirn.exe" ]; then src="$bindir/kirn.exe"; ext=".exe"; else src="$bindir/kirn"; ext=""; fi
          [ -f "$src" ] || { echo "::error::no kirn binary in $bindir"; exit 1; }

          stage="dist/kirn-$TARGET"
          mkdir -p "$stage/bin"
          cp "$src" "$stage/bin/kirn$ext"
          cp -R stdlib src "$stage/"
          cp README.md "$stage/"

          # The raw executable as its own asset, so it can be fetched directly
          # without unpacking an archive. Named per target because a release
          # cannot hold two assets called `kirn`.
          cp "$src" "dist/kirn-$TARGET$ext"
          chmod +x "dist/kirn-$TARGET$ext" 2>/dev/null || true

          # Print what was actually staged: a silent cp failure here used to
          # surface much later as a confusing "no such file" in the smoke test.
          echo "staged $TARGET from $src"
          ls -la "$stage/bin"
          ls -la dist

      # Native targets are executed; cross targets cannot run here, so they were
      # verified structurally above.
      - name: Smoke test
        if: matrix.mode == 'native'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          stage="$PWD/dist/kirn-$TARGET"
          if [ -f "$stage/bin/kirn.exe" ]; then exe="$stage/bin/kirn.exe"; else exe="$stage/bin/kirn"; fi
          if [ ! -f "$exe" ]; then
            echo "::error::no staged executable at $exe"
            echo "::error::what the stage step produced:"
            ls -la "$stage" 2>&1 || true
            ls -la "$stage/bin" 2>&1 || true
            ls -la "$PWD/dist" 2>&1 || true
            exit 1
          fi
          echo "smoke testing $exe"

          out=$(env -u KIRN_STDLIB -u KIRN_PETS -u KIRN_CXX "$exe" run examples/01_hello.kn)
          echo "$out"
          case "$out" in
            *"Hello, World!"*) ;;
            *) echo "::error::smoke: expected 'Hello, World!', got: $out"; exit 1 ;;
          esac

          # A project outside the repo importing the standard library: exactly
          # how an installed copy is used once KIRN_STDLIB is set.
          work="$(mktemp -d)"
          cp -R "$stage/stdlib" "$work/stdlib"
          mkdir -p "$work/proj"
          cat > "$work/proj/main.kn" <<'KN'
          import pet.math;

          def main() {
              print(math.abs(-42));
          }
          KN
          got=$(cd "$work/proj" && env -u KIRN_PETS KIRN_STDLIB="$work/stdlib" "$exe" run main.kn)
          echo "$got"
          case "$got" in
            *42*) ;;
            *) echo "::error::smoke: expected 42 from the math module, got: $got"; exit 1 ;;
          esac
          echo "smoke ok: $TARGET"

      # Asset names carry no version, so the installer can use the stable
      # /releases/latest/download/<name> URL with no API call to resolve a tag.
      - name: Archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          python3 - "$TARGET" <<'PY'
          import os, shutil, sys
          target = sys.argv[1]
          root = os.path.join("dist", "kirn-%s" % target)
          if target.startswith("windows"):
              fmt, ext = "zip", "zip"
          else:
              fmt, ext = "gztar", "tar.gz"
          out = shutil.make_archive(os.path.join("dist", "kirn-%s" % target), fmt,
                                    "dist", os.path.basename(root))
          print("archived %s" % out)
          PY
          ls -la dist

      # Only the archives and the raw executable are uploaded. Listing the bare
      # staged directory here would make upload-artifact ship the whole tree
      # (bin/ + src/ + stdlib/ - already inside the archive) and recreate it as a
      # directory on download, which gh release upload then rejects with
      # "read ...: is a directory".
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kirn-${{ matrix.target }}
          path: |
            dist/kirn-${{ matrix.target }}.tar.gz
            dist/kirn-${{ matrix.target }}.zip
            dist/kirn-${{ matrix.target }}
            dist/kirn-${{ matrix.target }}.exe
          retention-days: 14
          if-no-files-found: error

  release:
    name: publish release
    runs-on: ubuntu-latest
    needs: [meta, build]
    if: needs.meta.outputs.publish == 'true'
    permissions:
      contents: write
    steps:
      # Needed to publish install.sh / install.ps1 as release assets. gh is still
      # given --repo below so it never depends on the checkout's remote.
      - uses: actions/checkout@v4

      - name: Download all target artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: kirn-*
          merge-multiple: true

      - name: Collect installers
        run: |
          set -euo pipefail
          cp install/install.sh dist/install.sh
          cp install/install.ps1 dist/install.ps1
          chmod +x dist/install.sh
          ls -la dist

      # Checksums are generated before publishing so install.sh can verify what
      # it downloaded, and users can verify the raw binaries too.
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum install.sh install.ps1 ./* > checksums.txt 2>/dev/null || true
          else
            shasum -a 256 install.sh install.ps1 ./* > checksums.txt
          fi
          cat checksums.txt

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          release_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          # Files only: dist/ also holds the staged kirn-<target>/ directories,
          # and gh release upload fails on a directory ("is a directory").
          mapfile -t assets < <(find dist -maxdepth 1 -type f | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::no assets to publish"; exit 1
          fi
          notes="$(mktemp)"
          {
            echo "Kirn \`$TAG\`."
            echo
            echo '## Install'
            echo
            echo 'Linux and macOS:'
            echo
            echo '```sh'
            echo "curl --proto '=https' --tlsv1.2 -sSf $release_url/install.sh | sh"
            echo '```'
            echo
            echo 'Windows (PowerShell):'
            echo
            echo '```powershell'
            echo "irm $release_url/install.ps1 | iex"
            echo '```'
            echo
            echo 'The installer detects your platform, verifies the download against'
            echo '`checksums.txt`, and installs to `~/.kirn` (`%USERPROFILE%\.kirn` on Windows).'
            echo 'It also sets `KIRN_STDLIB` so `import pet.*` works from any directory.'
            echo
            echo '## Downloads'
            echo
            echo '| asset | target | what it is |'
            echo '| --- | --- | --- |'
            for f in "${assets[@]}"; do
              name="$(basename "$f")"
              case "$name" in
                kirn-*.tar.gz) t="${name%.tar.gz}"; t="${t#kirn-}"; kind="full archive (compiler + stdlib + src)" ;;
                kirn-*.zip)    t="${name%.zip}";    t="${t#kirn-}"; kind="full archive (compiler + stdlib + src)" ;;
                kirn-*.exe)    t="${name%.exe}";    t="${t#kirn-}"; kind="raw executable (needs stdlib separately)" ;;
                kirn-*)        t="${name#kirn-}";  kind="raw executable (needs stdlib separately)" ;;
                *)             t="-"; kind="installer / checksum" ;;
              esac
              echo "| [\`$name\`]($release_url/$name) | \`$t\` | $kind |"
            done
            echo
            echo 'Raw executables are provided for convenience, but they need the standard'
            echo 'library next to them (or `KIRN_STDLIB` set) for `import pet.*` to resolve - the'
            echo 'archive is the supported way to install.'
          } > "$notes"
          cat "$notes"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
          else
            gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
              --notes-file "$notes" --title "Kirn $TAG"
          fi
