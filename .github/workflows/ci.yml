name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  release-contract:
    name: release/version contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check version and release tag contract
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .version)"
          test "$version" = "0.0.1-b3"
          node -e 'const p=require("./package.json"); if(p.version!=="0.0.1-b3" || p.private) process.exit(1)'
          grep -n '0\.0\.1-b3' .version package.json installer.sh installer.ps1 CITATION.cff packaging/chocolatey/kirn.nuspec
          if grep -RInE '0\.0\.1-beta|0\.0\.1--beta' --exclude-dir=.git --exclude-dir=KIRN_PLANS --exclude-dir=docs-site .; then
            echo 'stale release version found'; exit 1
          fi
  # The full seven-suite matrix (runall/types/negative/vm_diff/conventions/
  # test/pats) against a from-scratch cmake build. build-test covers the same
  # suites on Windows via the PowerShell harnesses; this job is the Linux
  # equivalent, and it is the job that proves `cmake --build` output - not just
  # a locally hand-rolled build - still passes the whole corpus.
  corpus:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        id: build
        run: cmake --build build -j "$(nproc)"

      # Each gate is an independent script under scripts/gates/ (no aggregate
      # driver): run them all, one process per gate. A failing gate no longer
      # stops the loop, so one red gate cannot hide the state of the others;
      # the step still fails at the end and names every gate that failed.
      - name: Corpus gates
        id: gates
        run: |
          failed=()
          for g in scripts/gates/[0-9]*.sh; do
            echo "::group::$g"
            if ! bash "$g"; then
              failed+=("$g")
              echo "::error::gate failed: $g"
            fi
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            printf 'FAILED GATE: %s\n' "${failed[@]}"
            exit 1
          fi

      # Triage for the 69_parallel_sort hang (watchdog 20 s). A deadlock in the
      # runtime cannot be fixed from a workflow, so this step only gathers the
      # evidence needed to fix it: is it deterministic or a race, how many
      # cores the runner has, and where every thread is parked when it hangs.
      # Exit code 124 below means "timed out".
      - name: Triage parallel_sort hang
        if: ${{ failure() && steps.gates.conclusion == 'failure' }}
        continue-on-error: true
        run: |
          echo "cores: $(nproc)"
          f="$(find examples -name '69_parallel_sort.kn' | head -1)"
          [ -n "$f" ] || { echo "69_parallel_sort.kn not found"; exit 0; }
          for i in $(seq 1 10); do
            if timeout 20 build/kirnrun "$f" >/dev/null 2>&1; then rc=0; else rc=$?; fi
            echo "run $i: exit=$rc"
          done
          sudo apt-get install -y gdb >/dev/null 2>&1 || true
          for i in $(seq 1 5); do
            build/kirnrun "$f" >/dev/null 2>&1 &
            pid=$!
            sleep 8
            if kill -0 "$pid" 2>/dev/null; then
              echo "attempt $i: still running after 8 s - thread stacks:"
              sudo gdb -p "$pid" -batch -ex 'thread apply all bt' 2>&1 | tail -120 || true
              kill -9 "$pid" 2>/dev/null || true
              break
            fi
            wait "$pid" || true
          done

      # The sanitizer and snapshot steps below are independent of the gates, so
      # they still run when a gate failed (but not when the build itself broke).
      - name: ASan corpus (examples)
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        run: bash scripts/asanall.sh 2>&1 | tail -30

      - name: TSan corpus (examples)
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        run: bash scripts/tsanall.sh 2>&1 | tail -30

      # Phase 1 verification. These two were the missing oracles until now:
      # the gate scripts assert exit codes and substring greps, so they stay
      # green while whitespace, ordering and stderr wording change freely -- and
      # kirnlex/kirnparse/kirnrun were exercised by NO ci job at all before
      # this. The golden suite is the absolute byte oracle; the cross-check is
      # the differential one proving `kirnc <verb>` and the legacy binaries are
      # the same code. Both are needed: a change to the shared front end moves
      # both sides of the cross-check together (so it stays green) and is caught
      # only by the goldens.
      - name: Golden behaviour snapshots
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        run: bash scripts/golden_linux.sh

      - name: kirnc vs legacy tool cross-check
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        run: bash scripts/crosscheck_linux.sh

  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Windows libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          vcpkg install openssl:x64-windows zlib:x64-windows sqlite3:x64-windows --clean-after-build

      # src/interp/runtime.cpp is one very large translation unit; in a Debug
      # build it overflows MSVC's default object-file section limit (error
      # C1128, "compile with /bigobj"). CMake folds $env:CXXFLAGS into
      # CMAKE_CXX_FLAGS *on top of* its own defaults (/EHsc etc.), unlike
      # -DCMAKE_CXX_FLAGS which would replace them. "-bigobj" is the dash
      # spelling of /bigobj: identical to cl.exe, and immune to MSYS path
      # mangling if this is ever moved to a bash step.
      - name: Configure
        env:
          CXXFLAGS: -bigobj
        run: >-
          cmake -S . -B build
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Debug

      - name: Corpus (examples/*.kn)
        shell: pwsh
        run: scripts/runall.ps1 -Runner build\Debug\kirnrun.exe

      - name: No-toolchain cross build must hard-fail (no .cob fallback)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # absolute paths: relative ones break after Push-Location
          # (and pwsh then reports "The module 'build' could not be loaded")
          $kirn = Join-Path $PWD "build\Debug\kirn.exe"
          & $kirn "new" "demo"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location demo
          try {
            # a non-host target with no cross toolchain must fail loudly:
            # the old portable .cob bundle fallback was removed
            & $kirn "build" "--target=linux-amd64"
            if ($LASTEXITCODE -eq 0) {
              Write-Host "::error::cross build without toolchain should fail";
              exit 1
            }
            Write-Host "cross build failed as expected (exit $LASTEXITCODE)"
          } finally { Pop-Location }
          # The cross build above is SUPPOSED to exit nonzero, and the assertion
          # passed - but `pwsh -Command` exits with the last native command's
          # code, so that expected failure would fail this step anyway. Exit 0
          # explicitly: reaching here means the assertion held.
          exit 0

      - name: Upload tools
        uses: actions/upload-artifact@v4
        with:
          name: kirn-tools
          # The Debug build links vcpkg's dynamic x64-windows triplet, so the
          # exes load libcrypto/zlib/sqlite DLLs that vcpkg copies beside them.
          # Ship those too, or cross-arm64 cannot start kirn.exe.
          path: |
            build/Debug/kirn.exe
            build/Debug/kirnrun.exe
            build/Debug/*.dll
          retention-days: 1
          if-no-files-found: error

  cross-arm64:
    runs-on: windows-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      # flattened by the artifact: lands at build\kirn.exe, build\kirnrun.exe
      # (kirn resolves its runtime sources at <exe-dir>/../src, so the exe
      # must sit exactly one level below the checkout root)
      - name: Download tools
        uses: actions/download-artifact@v4
        with:
          name: kirn-tools
          path: build

      - name: Install llvm-mingw (aarch64 toolchain)
        shell: pwsh
        run: |
          $ver = "20260616"
          $zip = "$env:RUNNER_TEMP\llvm-mingw-$ver.zip"
          Invoke-WebRequest -Uri `
            "https://github.com/mstorsjo/llvm-mingw/releases/download/$ver/llvm-mingw-$ver-ucrt-x86_64.zip" `
            -OutFile $zip
          $dest = "$env:RUNNER_TEMP\llvm-mingw"
          Expand-Archive $zip -DestinationPath $dest
          Add-Content $env:GITHUB_PATH "$dest\llvm-mingw-$ver-ucrt-x86_64\bin"

      - name: Cross-build ARM64 binary + verify PE header
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # absolute paths survive Push-Location armapp below
          $kirn = Join-Path $PWD "build\kirn.exe"
          $run = Join-Path $PWD "build\kirnrun.exe"
          & $kirn "targets"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $kirn "new" "armapp"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location armapp
          try {
            & $kirn "build" "--release" "--target=windows-arm64"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $exe = Get-ChildItem build -Recurse -Filter armapp.exe |
              Where-Object { $_.FullName -match "windows-arm64" } |
              Select-Object -First 1
            if (-not $exe) { Write-Host "::error::no ARM64 exe"; exit 1 }
            $b = [IO.File]::ReadAllBytes($exe.FullName)
            $peOff = [BitConverter]::ToInt32($b, 0x3C)
            $mach = [BitConverter]::ToUInt16($b, $peOff + 4)
            Write-Host ("{0}: machine=0x{1:X4}" -f $exe.Name, $mach)
            if ($mach -ne 0xAA64) {
              Write-Host "::error::expected ARM64 (0xAA64) machine type"
              exit 1
            }

            # a target with no toolchain must now hard-fail: the portable
            # .cob bundle fallback was removed
            & $kirn "build" "--target=linux-amd64"
            if ($LASTEXITCODE -eq 0) {
              Write-Host "::error::cross build without toolchain should fail"
              exit 1
            }
            Write-Host "no-toolchain cross build failed as expected"
          } finally { Pop-Location }
          # Same trap as the build-test step: that nonzero exit is the expected
          # result, but GitHub's pwsh shell ends the step with $LASTEXITCODE, so
          # without this the step fails even though every assertion above passed.
          exit 0
