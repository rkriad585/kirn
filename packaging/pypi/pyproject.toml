[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kirn"
version = "0.0.1b3"
description = "Install and run the Kirn compiler from PyPI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0 OR MIT" }
authors = [{ name = "RK Riad Khan", email = "rkriad585@gmail.com" }]
dependencies = []

[project.scripts]
kirn = "kirn_lang.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
