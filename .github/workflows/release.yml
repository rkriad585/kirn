name: release

# Builds the Kirn toolchain for the supported target triples and, on a
# v0.0.1-bN tag, publishes it to a GitHub Release together with installers.
#
#   Linux amd64 + arm64 / macOS amd64 + arm64 / Windows amd64 + arm64
#   / Termux aarch64 + x86_64
#
# A dispatch with no tag is a DRY RUN:
# the whole matrix still builds and is still verified, but nothing is published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release as (e.g. v0.0.1-b3). Leave empty for a dry run."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        env:
          REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
            publish=true
          elif [ "${REF#refs/tags/}" != "$REF" ]; then
            tag="${REF#refs/tags/}"
            publish=true
          else
            tag="nightly-$(git rev-parse --short HEAD)"
            publish=false
          fi
          if [ "$publish" = true ] && ! printf '%s' "$tag" | grep -Eq '^v0\.0\.1-b[0-9]+$'; then
            echo "::error::release tag must match v0.0.1-bN; got $tag"
            exit 1
          fi
          {
            echo "version=${tag#v}"
            echo "tag=$tag"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "version=${tag#v} tag=$tag publish=$publish"

  build:
    name: ${{ matrix.target }}
    needs: meta
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      # One target failing must not hide the state of the other five.
      fail-fast: false
      matrix:
        include:
          # Linux and Windows use x64 hosted runners for native/cross builds;
          # macOS uses macos-latest and clang's sibling-architecture support.
          - target: linux-amd64
            os: ubuntu-latest
            mode: native
            runner_target: linux-amd64
          - target: linux-arm64
            os: ubuntu-latest
            mode: cross
            cc: aarch64-linux-gnu-g++
            sysroot: /usr/aarch64-linux-gnu
          - target: darwin-amd64
            os: macos-latest
            mode: cross
          - target: darwin-arm64
            os: macos-latest
            mode: native
            runner_target: darwin-arm64
          - target: windows-amd64
            os: windows-latest
            mode: native
            runner_target: windows-amd64
          - target: windows-arm64
            # windows-latest moved to the Visual Studio 2026 image in June 2026;
            # windows-2022 still ships VS 2022 plus the MSVC ARM64 tools. The
            # configure step no longer hard-codes a generator, so CMake uses
            # whatever Visual Studio the runner has - this pin only keeps the
            # toolset stable. A preflight step below fails with a clear message
            # if the ARM64 tools ever disappear from the image.
            os: windows-2022
            # vcpkg's arm64-windows-static libraries are MSVC ABI libraries.
            # Build them with the hosted Visual Studio ARM64 generator instead
            # of mixing them with LLVM-MinGW's incompatible CRT.
            mode: msvc-cross

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU for Linux ARM64
        if: matrix.target == 'linux-arm64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      # ubuntu-latest ships cmake; the Arch/macOS images do not guarantee it.
      - name: Ensure cmake
        shell: bash
        run: |
          set -euo pipefail
          if command -v cmake >/dev/null 2>&1; then cmake --version | head -1; exit 0; fi
          echo "cmake missing; installing"
          case "$(uname -s)" in
            Darwin) brew install cmake ;;
            MINGW*|MSYS*|CYGWIN*) choco install cmake --no-progress ;;
            *) sudo apt-get update && sudo apt-get install -y cmake ;;
          esac
          cmake --version | head -1

      # Fail early and legibly. A missing ARM64 toolset used to surface as the
      # misleading CMake error "could not find any instance of Visual Studio".
      - name: Verify Visual Studio ARM64 build tools
        if: matrix.mode == 'msvc-cross'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          Write-Host "Visual Studio instances on this runner:"
          & $vswhere -all -prerelease -products * -format text | Select-String 'displayName|installationVersion|installationPath'
          $arm = & $vswhere -latest -prerelease -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 `
            -property installationPath
          if (-not $arm) {
            Write-Host "::error::no Visual Studio with the MSVC ARM64 build tools (VC.Tools.ARM64) on this runner image"
            exit 1
          }
          Write-Host "ARM64 tools found in: $arm"

      - name: Install native Windows libraries
        if: matrix.target == 'windows-amd64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Published Windows archives contain no DLL directory, so use static
          # triplets and keep kirn.exe/kirnc.exe self-contained.
          vcpkg install openssl:x64-windows-static zlib:x64-windows-static sqlite3:x64-windows-static --clean-after-build

      - name: Install native macOS libraries
        if: startsWith(matrix.target, 'darwin-')
        shell: bash
        run: |
          set -euo pipefail
          brew install openssl@3 zlib sqlite3
          {
            echo "CMAKE_PREFIX_PATH=$(brew --prefix openssl@3):$(brew --prefix zlib):$(brew --prefix sqlite3)"
          } >> "$GITHUB_ENV"

      - name: Install macOS amd64 libraries
        if: matrix.target == 'darwin-amd64'
        shell: bash
        run: |
          set -euo pipefail
          vcpkg install openssl:x64-osx zlib:x64-osx sqlite3:x64-osx --clean-after-build

      - name: Install cross Windows libraries
        if: matrix.target == 'windows-arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          vcpkg install openssl:arm64-windows-static zlib:arm64-windows-static sqlite3:arm64-windows-static --clean-after-build

      - name: Configure and build
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
          TARGET: ${{ matrix.target }}
          CC: ${{ matrix.cc }}
          SYSROOT: ${{ matrix.sysroot }}
          # src/interp/runtime.cpp overflows MSVC's default object-section limit
          # (error C1128). CMake appends $CXXFLAGS to its own MSVC defaults, so
          # this does not clobber /EHsc. "-bigobj" rather than "/bigobj": a
          # leading slash would be rewritten to a Git-for-Windows path by
          # MSYS before cmake ever saw it. Empty (harmless) off Windows.
          CXXFLAGS: ${{ startsWith(matrix.target, 'windows-') && '-bigobj' || '' }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = linux-arm64 ]; then
            docker run --rm --platform linux/arm64 \
              -v "$GITHUB_WORKSPACE:/work" ubuntu:24.04 bash -lc '
                set -eu
                export DEBIAN_FRONTEND=noninteractive
                apt-get update
                apt-get install -y cmake ninja-build g++ libssl-dev zlib1g-dev libsqlite3-dev
                cmake -S /work -B /work/build -DCMAKE_BUILD_TYPE=Release
                cmake --build /work/build --target kirn kirnc -j "$(nproc)"
              '
            exit 0
          fi
          case "$MODE" in
            native)
              if [ "$TARGET" = windows-amd64 ]; then
                if [ -z "${VCPKG_INSTALLATION_ROOT:-}" ]; then
                  echo "::error::VCPKG_INSTALLATION_ROOT is required for the native Windows release"
                  exit 1
                fi
                cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                  -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
                  -DVCPKG_TARGET_TRIPLET=x64-windows-static \
                  -DOPENSSL_USE_STATIC_LIBS=TRUE \
                  -DZLIB_USE_STATIC_LIBS=TRUE \
                  -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
              elif [ "$TARGET" = darwin-arm64 ] && [ -n "${CMAKE_PREFIX_PATH:-}" ]; then
                cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                  -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH"
              else
                cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
              fi
              ;;
            msvc-cross)
              if [ "$TARGET" != windows-arm64 ]; then
                echo "::error::msvc-cross is only supported for windows-arm64"
                exit 1
              fi
              if [ -z "${VCPKG_INSTALLATION_ROOT:-}" ]; then
                echo "::error::VCPKG_INSTALLATION_ROOT is required for the Windows ARM64 release"
                exit 1
              fi
              # No -G: let CMake pick the newest Visual Studio on the runner
              # (17 2022 on windows-2022, 18 2026 on windows-latest). Naming
              # one generator is what produced "could not find any instance of
              # Visual Studio" when the image moved.
              cmake -S . -B build -A ARM64 \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
                -DVCPKG_TARGET_TRIPLET=arm64-windows-static \
                -DOPENSSL_USE_STATIC_LIBS=TRUE \
                -DZLIB_USE_STATIC_LIBS=TRUE \
                -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
              ;;
            cross)
              # Everything below is derived from the target triple. Hardcoding the
              # system name is a trap: a "Linux" system name for the Windows
              # cross build silently drops if(WIN32) from CMakeLists, so ws2_32
              # is never linked and the link fails on WSAStartup.
              os="${TARGET%%-*}"
              arch="${TARGET#*-}"
              case "$arch" in
                arm64) proc=aarch64 ;;
                amd64) proc=x86_64 ;;
                *) echo "::error::cannot map arch '$arch'"; exit 1 ;;
              esac
              if [ "$os" = "darwin" ]; then
                # Apple clang cross-builds to the sibling arch off one SDK.
                if [ "$TARGET" = darwin-amd64 ]; then
                  cmake -S . -B build \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DCMAKE_OSX_ARCHITECTURES=x86_64 \
                    -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
                    -DVCPKG_TARGET_TRIPLET=x64-osx
                else
                  cmake -S . -B build \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DCMAKE_OSX_ARCHITECTURES="$proc" \
                    -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH"
                fi
              else
                # Windows ARM64 is built with MSVC (mode msvc-cross above), so the
                # only non-Apple cross target left here is Linux.
                case "$os" in
                  linux) sysname=Linux ;;
                  *) echo "::error::cannot map os '$os'"; exit 1 ;;
                esac
                # Deliberately NOT -static on the ELF target: the Ubuntu cross
                # toolchain ships no static libc/libm. The glibc floor is set by
                # the build runner - see the release notes.
                cmake_args=(
                  -S . -B build -G Ninja
                  -DCMAKE_BUILD_TYPE=Release
                  -DCMAKE_SYSTEM_NAME="$sysname"
                  -DCMAKE_SYSTEM_PROCESSOR="$proc"
                  -DCMAKE_C_COMPILER="${CC%g++}gcc"
                  -DCMAKE_CXX_COMPILER="$CC"
                  -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER
                  -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY
                  -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY
                )
                cmake "${cmake_args[@]}"
                if [ "$os" = "linux" ]; then
                  cmake -S . -B build \
                    -DCMAKE_FIND_ROOT_PATH="$SYSROOT" \
                    -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
                    -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY
                fi
              fi
              ;;
            *) echo "::error::unknown mode $MODE"; exit 1 ;;
          esac
          # Release archives intentionally contain only the public compiler and
          # checker executables; auxiliary developer tools are not release API.
          cmake --build build --config Release --target kirn kirnc

      # For a native target the host MUST match, otherwise the archive would be
      # mislabelled (macos-latest has already moved between Intel and Apple
      # Silicon once). Cross targets are verified structurally below instead.
      - name: Verify native target matches the runner
        if: matrix.mode == 'native'
        shell: bash
        env:
          EXPECTED: ${{ matrix.runner_target }}
        run: |
          set -euo pipefail
          # Git-bash on Windows reports MINGW64_NT-*, so it needs its own case or
          # the check below cannot tell a Windows runner from an unknown host.
          uname_s="$(uname -s)"
          case "$uname_s" in
            Linux) os=linux ;;
            Darwin) os=darwin ;;
            MINGW*|MSYS*|CYGWIN*|Windows_NT) os=windows ;;
            *) os="unknown($uname_s)" ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64) arch=amd64 ;;
            arm64|aarch64) arch=arm64 ;;
            *) arch="$(uname -m)" ;;
          esac
          actual="$os-$arch"
          echo "runner is $actual, matrix claims $EXPECTED"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::runner is $actual but this job is labelled $EXPECTED - fix the matrix"
            exit 1
          fi

      - name: Verify cross target architecture
        if: matrix.mode == 'cross' || matrix.mode == 'msvc-cross'
        shell: bash
        env:
          EXPECTED: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # A cross binary cannot run on the build machine, so assert on the
          # header bytes instead. ELF e_machine, PE machine, and Mach-O cputype
          # are all read straight out of the file.
          py="$(command -v python3 || command -v python)"
          "$py" - "$EXPECTED" <<'PY'
          import glob, struct, sys
          expected = sys.argv[1]
          want = {
              "linux-arm64": (0xB7, "ELF AArch64"),
              "darwin-amd64": (0x01000007, "Mach-O x86_64"),
              "windows-arm64": (0xAA64, "PE ARM64"),
          }[expected]
          code, label = want
          paths = glob.glob("build/kirn") + glob.glob("build/Release/kirn.exe") \
              + glob.glob("build/kirn.exe")
          if not paths:
              sys.exit("no kirn binary found in build/")
          path = paths[0]
          with open(path, "rb") as f:
              b = f.read()
          if b[:4] == b"\x7fELF":
              got = struct.unpack_from("<H", b, 18)[0]
          elif b[:2] == b"MZ":
              pe = struct.unpack_from("<I", b, 0x3C)[0]
              got = struct.unpack_from("<H", b, pe + 4)[0]
          elif b[:4] in (b"\xfe\xed\xfa\xcf", b"\xcf\xfa\xed\xfe"):
              got = struct.unpack_from("<I", b, 4)[0] & 0xFFFFFFFF
          else:
              sys.exit(f"{path}: unrecognised binary format")
          print(f"{path}: machine=0x{got:04X} (expected {label} 0x{code:04X})")
          if got != code:
              sys.exit(f"wrong architecture: got 0x{got:04X}, want {label}")
          PY

      # One executable plus the data it needs: stdlib/ for imports, src/ for
      # `kirn build --native`. The staged tree lives in stage/, NOT in dist/.
      # dist/ holds only files that get uploaded, and on Linux/macOS the raw
      # executable is named dist/kirn-<target>. When the staged directory was
      # dist/kirn-<target> as well, `cp kirn dist/kirn-<target>` copied the
      # binary *into* that directory: the raw-executable asset never existed and
      # upload-artifact shipped the whole tree instead.
      - name: Stage distribution
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # MSVC is multi-config and drops binaries in build/Release.
          if [ -f build/Release/kirn.exe ]; then bindir=build/Release; else bindir=build; fi
          # $ext carries its own leading dot: it is concatenated directly, and
          # without the dot the copies below are named "kirnexe" and
          # "kirn-windows-amd64exe".
          if [ -f "$bindir/kirn.exe" ]; then src="$bindir/kirn.exe"; ext=".exe"; else src="$bindir/kirn"; ext=""; fi
          [ -f "$src" ] || { echo "::error::no kirn binary in $bindir"; exit 1; }
          csrc="$bindir/kirnc$ext"
          [ -f "$csrc" ] || { echo "::error::no kirnc binary in $bindir"; exit 1; }

          stage="stage/kirn-$TARGET"
          mkdir -p dist "$stage/bin"
          cp "$src" "$stage/bin/kirn$ext"
          cp "$csrc" "$stage/bin/kirnc$ext"
          cp -R stdlib src "$stage/"
          cp README.md "$stage/"

          # The raw executables as their own assets, so they can be fetched
          # directly without unpacking an archive. Named per target because a
          # release cannot hold two assets called `kirn`.
          cp "$src" "dist/kirn-$TARGET$ext"
          cp "$csrc" "dist/kirnc-$TARGET$ext"
          chmod +x "dist/kirn-$TARGET$ext" "dist/kirnc-$TARGET$ext" 2>/dev/null || true

          # Print what was actually staged: a silent cp failure here used to
          # surface much later as a confusing "no such file" in the smoke test.
          echo "staged $TARGET from $src"
          ls -la "$stage/bin"
          ls -la dist

      # Native targets are executed; cross targets cannot run here, so they were
      # verified structurally above. Windows has its own step below.
      - name: Smoke test
        if: matrix.mode == 'native' && !startsWith(matrix.target, 'windows-')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          stage="$PWD/stage/kirn-$TARGET"
          exe="$stage/bin/kirn"
          if [ ! -f "$exe" ]; then
            echo "::error::no staged executable at $exe"
            ls -la "$stage" 2>&1 || true
            ls -la "$stage/bin" 2>&1 || true
            exit 1
          fi
          echo "smoke testing $exe"
          export PATH="$PWD/build:$PATH"

          out=$(env -u KIRN_STDLIB -u KIRN_PATS -u KIRN_CXX "$exe" run examples/01_hello.kn)
          echo "$out"
          case "$out" in
            *"Hello, World!"*) ;;
            *) echo "::error::smoke: expected 'Hello, World!', got: $out"; exit 1 ;;
          esac

          # A project outside the repo importing the standard library: exactly
          # how an installed copy is used once KIRN_STDLIB is set.
          work="$(mktemp -d)"
          cp -R "$stage/stdlib" "$work/stdlib"
          mkdir -p "$work/proj"
          cat > "$work/proj/main.kn" <<'KN'
          import pat.math;

          fn main() {
              print(math.abs(-42));
          }
          KN
          got=$(cd "$work/proj" && env -u KIRN_PATS KIRN_STDLIB="$work/stdlib" "$exe" run main.kn)
          echo "$got"
          case "$got" in
            *42*) ;;
            *) echo "::error::smoke: expected 42 from the math module, got: $got"; exit 1 ;;
          esac
          echo "smoke ok: $TARGET"

      # Windows smoke test, in PowerShell rather than Git Bash. From bash the
      # exe was started as ./dist/<...>/kirn.exe, a POSIX-style relative path:
      # the executable learns its own location from argv[0], and anything it
      # then hands to cmd.exe (which reads "./dist" as a switch) fails with the
      # unhelpful "The system cannot find the path specified." Here it gets a
      # real absolute Windows path. It also runs with a minimal PATH, which is
      # the real test that the exe is self-contained (static vcpkg + /MT): a
      # missing DLL shows up as exit code 0xC0000135 instead of being masked
      # by DLLs that happen to be on the runner's PATH.
      - name: Smoke test (Windows)
        if: matrix.mode == 'native' && startsWith(matrix.target, 'windows-')
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = "Stop"
          $stageRoot = Join-Path $PWD "stage"
          $stage = Join-Path $stageRoot "kirn-$env:TARGET"
          $exe = Join-Path $stage "bin\kirn.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            Write-Host "::error::no staged executable at $exe"
            Get-ChildItem -Recurse -LiteralPath $stageRoot | Select-Object -First 60 -ExpandProperty FullName
            exit 1
          }
          Write-Host "smoke testing $exe"
          Get-Item -LiteralPath $exe | Format-List FullName, Length

          foreach ($v in 'KIRN_STDLIB', 'KIRN_PATS', 'KIRN_CXX') {
            Remove-Item "Env:$v" -ErrorAction SilentlyContinue
          }
          # Only the OS itself: no vcpkg, Git, MinGW or Strawberry Perl DLLs.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"

          function Invoke-Kirn([string[]]$KirnArgs) {
            $ErrorActionPreference = "Continue"
            $text = & $exe @KirnArgs 2>&1 | Out-String
            [pscustomobject]@{ Code = $LASTEXITCODE; Text = $text }
          }
          function Assert-Kirn($r, [string]$expect, [string]$what) {
            Write-Host $r.Text
            if ($r.Code -ne 0 -or $r.Text -notmatch [regex]::Escape($expect)) {
              $hex = '0x{0:X8}' -f ([int]$r.Code)
              Write-Host "::error::smoke ($what): exit $($r.Code) ($hex), expected output containing '$expect'"
              if ($hex -eq '0xC0000135') { Write-Host "::error::STATUS_DLL_NOT_FOUND - kirn.exe still depends on a DLL that is not shipped" }
              exit 1
            }
          }

          Assert-Kirn (Invoke-Kirn @('run', 'examples/01_hello.kn')) 'Hello, World!' 'hello'

          # A project outside the repo importing the standard library: exactly
          # how an installed copy is used once KIRN_STDLIB is set.
          $work = Join-Path $env:RUNNER_TEMP "kirn-smoke"
          if (Test-Path -LiteralPath $work) { Remove-Item -Recurse -Force -LiteralPath $work }
          New-Item -ItemType Directory -Path (Join-Path $work "proj") | Out-Null
          Copy-Item -Recurse -LiteralPath (Join-Path $stage "stdlib") -Destination (Join-Path $work "stdlib")
          @'
          import pat.math;

          fn main() {
              print(math.abs(-42));
          }
          '@ | Set-Content -Path (Join-Path $work "proj\main.kn") -Encoding ascii
          Push-Location (Join-Path $work "proj")
          try {
            $env:KIRN_STDLIB = Join-Path $work "stdlib"
            Assert-Kirn (Invoke-Kirn @('run', 'main.kn')) '42' 'stdlib import'
          } finally { Pop-Location }
          Write-Host "smoke ok: $env:TARGET"

      # Asset names carry no version, so the installer can use the stable
      # /releases/latest/download/<name> URL with no API call to resolve a tag.
      - name: Archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          py="$(command -v python3 || command -v python)"
          "$py" - "$TARGET" <<'PY'
          import os, shutil, sys
          target = sys.argv[1]
          name = "kirn-%s" % target
          if target.startswith("windows"):
              fmt = "zip"
          else:
              fmt = "gztar"
          # root_dir=stage, base_dir=kirn-<target>: the archive holds one
          # top-level kirn-<target>/ directory, written to dist/.
          out = shutil.make_archive(os.path.join("dist", name), fmt, "stage", name)
          print("archived %s" % out)
          PY
          ls -la dist

      # Only archives and raw executables live in dist/, so every pattern below
      # is a file (the staged tree is in stage/ and is already inside the
      # archive). Patterns that match nothing on a given OS are fine;
      # if-no-files-found only errors when none of them match.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kirn-${{ matrix.target }}
          path: |
            dist/kirn-${{ matrix.target }}.tar.gz
            dist/kirn-${{ matrix.target }}.zip
            dist/kirn-${{ matrix.target }}
            dist/kirn-${{ matrix.target }}.exe
            dist/kirnc-${{ matrix.target }}
            dist/kirnc-${{ matrix.target }}.exe
          retention-days: 14
          if-no-files-found: error

  termux:
    name: termux-${{ matrix.target }}
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            image: aarch64
            platform: linux/arm64
          - target: x86_64
            image: x86_64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU for Termux architectures
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all
      - name: Build Kirn and kirnc in Termux Docker
        shell: bash
        env:
          IMAGE: termux/termux-docker:${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # stage/ holds the staged tree, dist/ only the uploaded files; both
          # must be writable by the unprivileged user inside the image.
          mkdir -p dist stage
          chmod -R a+rwX dist stage
          printf '%s' "$TARGET" > dist/.kirn-target
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            --platform "$PLATFORM" "$IMAGE" sh -lc '
              set -eu
              target="$(cat /work/dist/.kirn-target)"
              # The image may start with a rotating third-party mirror. A
              # mirror can publish Release metadata before its Packages index
              # is synchronized, which makes apt reject the index as having an
              # unexpected size. Use the official Termux primary repository and
              # rebuild the container-local index before installing packages.
              printf "%s\\n" \
                "deb https://packages.termux.dev/apt/termux-main stable main" \
                > "$PREFIX/etc/apt/sources.list"
              rm -rf "$PREFIX/var/lib/apt/lists/"*
              mkdir -p "$PREFIX/var/lib/apt/lists/partial"
              updated=false
              for attempt in 1 2 3; do
                if apt-get -o Acquire::Retries=5 update; then
                  updated=true
                  break
                fi
                echo "Termux package index update failed (attempt $attempt/3); retrying"
                sleep 5
              done
              [ "$updated" = true ]
              apt-get -o Acquire::Retries=5 install -y \
                clang cmake make openssl zlib sqlite libsqlite
              workroot="${TMPDIR:-$PREFIX/tmp}/kirn-build"
              rm -rf "$workroot"
              mkdir -p "$workroot"
              cp -R /work "$workroot/src"
              cmake -S "$workroot/src" -B "$workroot/build" -DCMAKE_BUILD_TYPE=Release \
                -DSQLite3_INCLUDE_DIR="$PREFIX/include" \
                -DSQLite3_LIBRARY="$PREFIX/lib/libsqlite3.so"
              cmake --build "$workroot/build" --target kirn kirnc -j "$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 2)"
              stage="/work/stage/kirn-termux-$target"
              mkdir -p "$stage/bin"
              cp "$workroot/build/kirn" "$workroot/build/kirnc" "$stage/bin/"
              cp -R /work/stdlib /work/src "$stage/"
              tar -czf "/work/dist/kirn-termux-$target.tar.gz" -C /work/stage "kirn-termux-$target"
              cp "$workroot/build/kirn" "/work/dist/kirn-termux-$target"
              cp "$workroot/build/kirnc" "/work/dist/kirnc-termux-$target"
            '
      - name: Upload Termux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kirn-termux-${{ matrix.target }}
          path: |
            dist/kirn-termux-${{ matrix.target }}.tar.gz
            dist/kirn-termux-${{ matrix.target }}
            dist/kirnc-termux-${{ matrix.target }}
          if-no-files-found: error

  release:
    name: publish release
    runs-on: ubuntu-latest
    needs: [meta, build, termux]
    if: needs.meta.outputs.publish == 'true'
    permissions:
      contents: write
    steps:
      # Needed to publish install.sh / install.ps1 as release assets. gh is still
      # given --repo below so it never depends on the checkout's remote.
      - uses: actions/checkout@v4

      - name: Download all target artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: kirn-*
          merge-multiple: true

      - name: Collect installers
        run: |
          set -euo pipefail
          # Root files are the stable raw.githubusercontent.com entry points.
          # Keep the old release asset names as compatibility aliases.
          cp installer.sh dist/installer.sh
          cp installer.ps1 dist/installer.ps1
          cp installer.sh dist/install.sh
          cp installer.ps1 dist/install.ps1
          chmod +x dist/install.sh
          chmod +x dist/installer.sh
          ls -la dist

      # Checksums are generated before publishing so install.sh can verify what
      # it downloaded. Filenames are emitted bare (no ./ prefix) and exactly
      # once, because a prefixed or duplicated entry is what previously stopped
      # the installer from finding its own hash.
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f ! -name checksums.txt -printf '%f\n' | sort |
            xargs -r sha256sum > checksums.txt
          cat checksums.txt

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          release_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          # Files only: dist/ also holds the staged kirn-<target>/ directories,
          # and gh release upload fails on a directory ("is a directory").
          mapfile -t assets < <(find dist -maxdepth 1 -type f | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::no assets to publish"; exit 1
          fi
          notes="$(mktemp)"
          {
            echo "Kirn \`$TAG\`."
            echo
            echo '## Install'
            echo
            echo 'Linux and macOS:'
            echo
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/rkriad585/kirn/main/installer.sh | sh"
            echo '```'
            echo
            echo 'Windows (PowerShell):'
            echo
            echo '```powershell'
            echo "irm https://raw.githubusercontent.com/rkriad585/kirn/main/installer.ps1 | iex"
            echo '```'
            echo
            echo 'The installer detects your platform, verifies the download against'
            echo '`checksums.txt`, and installs to `~/.kirn` (`%USERPROFILE%\.kirn` on Windows).'
            echo 'It also sets `KIRN_STDLIB` so `import pat.*` works from any directory.'
            echo
            echo '## Downloads'
            echo
            echo '| asset | target | what it is |'
            echo '| --- | --- | --- |'
            for f in "${assets[@]}"; do
              name="$(basename "$f")"
              case "$name" in
                kirn-*.tar.gz) t="${name%.tar.gz}"; t="${t#kirn-}"; kind="full archive (compiler + stdlib + src)" ;;
                kirn-*.zip)    t="${name%.zip}";    t="${t#kirn-}"; kind="full archive (compiler + stdlib + src)" ;;
                kirn-*.exe)    t="${name%.exe}";    t="${t#kirn-}"; kind="raw executable (needs stdlib separately)" ;;
                kirn-*)        t="${name#kirn-}";   kind="raw executable (needs stdlib separately)" ;;
                kirnc-*.exe)   t="${name%.exe}";    t="${t#kirnc-}"; kind="raw checker (needs stdlib separately)" ;;
                kirnc-*)       t="${name#kirnc-}";  kind="raw checker (needs stdlib separately)" ;;
                *)             t="-"; kind="installer / checksum" ;;
              esac
              echo "| [\`$name\`]($release_url/$name) | \`$t\` | $kind |"
            done
            echo
            echo 'Raw executables are provided for convenience, but they need the standard'
            echo 'library next to them (or `KIRN_STDLIB` set) for `import pat.*` to resolve - the'
            echo 'archive is the supported way to install.'
          } > "$notes"
          cat "$notes"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
          else
            gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
              --notes-file "$notes" --title "Kirn $TAG"
          fi

  publish-registries:
    name: publish npm and Chocolatey packages
    runs-on: windows-latest
    needs: [meta, build, release]
    if: needs.meta.outputs.publish == 'true' && needs.release.result == 'success'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify package versions
        shell: pwsh
        run: |
          $expected = '${{ needs.meta.outputs.version }}'
          $npm = (Get-Content package.json | ConvertFrom-Json).version
          $choco = ([xml](Get-Content packaging/chocolatey/kirn.nuspec)).package.metadata.version
          if ($npm -ne $expected -or $choco -ne $expected) { throw "package version mismatch: npm=$npm choco=$choco expected=$expected" }

      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_SCERET_KEY }}
        shell: pwsh
        run: |
          if (-not $env:NODE_AUTH_TOKEN) { throw 'NPM_SCERET_KEY is not configured' }
          npm config set //registry.npmjs.org/:_authToken=$env:NODE_AUTH_TOKEN
          npm publish --access public

      - name: Pack and publish Chocolatey package
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_SECRET_KEY }}
        shell: pwsh
        run: |
          if (-not $env:CHOCO_API_KEY) { throw 'CHOCO_SECRET_KEY is not configured' }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          choco pack packaging/chocolatey/kirn.nuspec --outputdirectory dist
          $pkg = Get-ChildItem dist -Filter 'kirn.*.nupkg' | Select-Object -First 1
          if (-not $pkg) { throw 'Chocolatey package was not created' }
          choco push $pkg.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY
