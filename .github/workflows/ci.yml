name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The language was renamed once; this keeps it renamed. Cheap enough (a few
  # git greps over ~250 files) to run on every change, and deliberately runs on
  # BOTH platforms so the gate cannot pass on one OS and fail on the other.
  rename-regression:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: No pre-rename tokens outside the allowlist
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pwsh -NoProfile -File scripts/rename_verify.ps1 `
            -Report _rename/gate-report.md

      - name: Publish gate report
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $report = "_rename/gate-report.md"
          if (Test-Path -LiteralPath $report) {
            Get-Content -LiteralPath $report | Out-String |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Write-Host "gate report written to $report"
          }

      - name: Upload gate report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rename-gate-report
          path: _rename/gate-report.md
          retention-days: 7
          if-no-files-found: ignore

  # The full seven-suite matrix (runall/types/negative/vm_diff/conventions/
  # test/pets) against a from-scratch cmake build. build-test covers the same
  # suites on Windows via the PowerShell harnesses; this job is the Linux
  # equivalent, and it is the job that proves `cmake --build` output - not just
  # a locally hand-rolled build - still passes the whole corpus.
  corpus:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Full corpus matrix
        run: bash scripts/gates_linux.sh

  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Debug

      - name: Corpus (examples/*.kn)
        shell: pwsh
        run: scripts/runall.ps1 -Runner build\Debug\kirnrun.exe

      - name: No-toolchain cross build must hard-fail (no .cob fallback)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # absolute paths: relative ones break after Push-Location
          # (and pwsh then reports "The module 'build' could not be loaded")
          $kirn = Join-Path $PWD "build\Debug\kirn.exe"
          & $kirn "new" "demo"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location demo
          try {
            # a non-host target with no cross toolchain must fail loudly:
            # the old portable .cob bundle fallback was removed
            & $kirn "build" "--target=linux-amd64"
            if ($LASTEXITCODE -eq 0) {
              Write-Host "::error::cross build without toolchain should fail";
              exit 1
            }
            Write-Host "cross build failed as expected (exit $LASTEXITCODE)"
          } finally { Pop-Location }
          # The cross build above is SUPPOSED to exit nonzero, and the assertion
          # passed - but `pwsh -Command` exits with the last native command's
          # code, so that expected failure would fail this step anyway. Exit 0
          # explicitly: reaching here means the assertion held.
          exit 0

      - name: Upload tools
        uses: actions/upload-artifact@v4
        with:
          name: kirn-tools
          path: |
            build/Debug/kirn.exe
            build/Debug/kirnrun.exe
          retention-days: 1
          if-no-files-found: error

  cross-arm64:
    runs-on: windows-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      # flattened by the artifact: lands at build\kirn.exe, build\kirnrun.exe
      # (kirn resolves its runtime sources at <exe-dir>/../src, so the exe
      # must sit exactly one level below the checkout root)
      - name: Download tools
        uses: actions/download-artifact@v4
        with:
          name: kirn-tools
          path: build

      - name: Install llvm-mingw (aarch64 toolchain)
        shell: pwsh
        run: |
          $ver = "20260616"
          $zip = "$env:RUNNER_TEMP\llvm-mingw-$ver.zip"
          Invoke-WebRequest -Uri `
            "https://github.com/mstorsjo/llvm-mingw/releases/download/$ver/llvm-mingw-$ver-ucrt-x86_64.zip" `
            -OutFile $zip
          $dest = "$env:RUNNER_TEMP\llvm-mingw"
          Expand-Archive $zip -DestinationPath $dest
          Add-Content $env:GITHUB_PATH "$dest\llvm-mingw-$ver-ucrt-x86_64\bin"

      - name: Cross-build ARM64 binary + verify PE header
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # absolute paths survive Push-Location armapp below
          $kirn = Join-Path $PWD "build\kirn.exe"
          $run = Join-Path $PWD "build\kirnrun.exe"
          & $kirn "targets"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $kirn "new" "armapp"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location armapp
          try {
            & $kirn "build" "--release" "--target=windows-arm64"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $exe = Get-ChildItem build -Recurse -Filter armapp.exe |
              Where-Object { $_.FullName -match "windows-arm64" } |
              Select-Object -First 1
            if (-not $exe) { Write-Host "::error::no ARM64 exe"; exit 1 }
            $b = [IO.File]::ReadAllBytes($exe.FullName)
            $peOff = [BitConverter]::ToInt32($b, 0x3C)
            $mach = [BitConverter]::ToUInt16($b, $peOff + 4)
            Write-Host ("{0}: machine=0x{1:X4}" -f $exe.Name, $mach)
            if ($mach -ne 0xAA64) {
              Write-Host "::error::expected ARM64 (0xAA64) machine type"
              exit 1
            }

            # a target with no toolchain must now hard-fail: the portable
            # .cob bundle fallback was removed
            & $kirn "build" "--target=linux-amd64"
            if ($LASTEXITCODE -eq 0) {
              Write-Host "::error::cross build without toolchain should fail"
              exit 1
            }
            Write-Host "no-toolchain cross build failed as expected"
          } finally { Pop-Location }
          # Same trap as the build-test step: that nonzero exit is the expected
          # result, but GitHub's pwsh shell ends the step with $LASTEXITCODE, so
          # without this the step fails even though every assertion above passed.
          exit 0
